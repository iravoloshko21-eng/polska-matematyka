/* Layout: model on squared paper (left), teacher's control panel (right); stacks on phones. Palette = Iryna's konspekt colours. */
:root {
  --paper: #ffffff;
  --grid: #e9edf3;
  --ink: #2A1F1B;
  --muted: #6d6a5c;
  --olive: #575D45;
  --cream: #F9F6F1;
  --line: #d9d3c7;
  --blue: #627CF2;
  --red: #d1422c;
  --green: #2e8b57;
  --face: rgba(87, 93, 69, 0.10);
  --cm: "CMU Serif", "Latin Modern Roman", "Computer Modern", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #17150f; --grid: #24211a; --ink: #f1ece2; --muted: #b3ad9c; --olive: #b9c09c; --cream: #221f17; --line: #3b372c;
  --blue: #8ea2ff; --red: #ff7a63; --green: #5fcf8f; --face: rgba(185, 192, 156, 0.12); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #17150f; --grid: #24211a; --ink: #f1ece2; --muted: #b3ad9c; --olive: #b9c09c; --cream: #221f17; --line: #3b372c;
  --blue: #8ea2ff; --red: #ff7a63; --green: #5fcf8f; --face: rgba(185, 192, 156, 0.12); color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--cm); font-size: 16px; letter-spacing: 0.02em;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; }

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");

  // ---------- shapes ----------
  const SHAPES = {

    sq: { name: "czworokątny prawidłowy", n: 4 },
    hex: { name: "sześciokątny prawidłowy", n: 6 },
    tet: { name: "czworościan foremny", n: 3, tet: true },
    rect: { name: "prosty, podstawa prostokąt", n: 4, rect: true },
    edge: { name: "krawędź SA prostopadła", n: 4, edge: true },

    tri: "Podstawa: trójkąt równoboczny. Spodek wysokości <i>O</i> to środek trójkąta: <i>R</i> = 2/3 wysokości podstawy, <i>r</i> = 1/3.",

    tet: "Wszystkie 6 krawędzi równe, 4 ściany to trójkąty równoboczne. Wysokość wynika z <i>a</i>: <i>H</i> = <i>a</i>√6 / 3.",
    rect: "Krawędzie boczne równe, <i>O</i> to środek prostokąta. Ściany są parami równe: dwie różne wysokości ścian.",
    edge: "Wysokością jest krawędź <i>SA</i>. Ściany <i>SAB</i> i <i>SAD</i> to trójkąty prostokątne (kąt prosty przy <i>A</i>).",
  };

    ["faces", "ściany", null], ["labels", "litery", null], ["H", "wysokość H", "--blue"], ["hs", "wysokość ściany hₛ", "--green"],

  // ---------- vector helpers ----------

  // ---------- geometry ----------
  function geom() {

  }

    nx /= L; ny /= L; const c = [W / 2, Hh / 2]; if ((s[0] - c[0]) * nx + (s[1] - c[1]) * ny < 0) { nx = -nx; ny = -ny; }

    ctx.font = `italic ${fs}px "CMU Serif", Georgia, serif`; ctx.fillStyle = col; ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // ---------- values ----------
  const fmt = (x) => (Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : x.toFixed(2).replace(".", ","));
  function root(x2) { // exact form when x² is an integer

      $("shapes").appendChild(b);
    });
    $("shapenote").innerHTML = NOTES[st.shape];
  }
  function renderToggles() {
    $("toggles").innerHTML = ""; const edge = SHAPES[st.shape].edge;
    TOG.forEach(([k, name, col]) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.id = "tog-" + k;
      b.innerHTML = (col ? `<i class="dot" style="background:var(${col})"></i>` : "") + `<span>${name.replace("ₛ", "<sub>s</sub>")}</span>`;
      b.setAttribute("aria-pressed", st.on[k] ? "true" : "false");
      b.disabled = edge && ["hs", "R", "r", "t3"].includes(k);
      b.onclick = () => { st.on[k] = !st.on[k]; renderToggles(); };
      $("toggles").appendChild(b);
    });
  }
  function sync() {
    st.a = +$("sa").value; st.H = +$("sh").value; $("oa").textContent = st.a; $("oh").textContent = st.H;
    $("sh").disabled = !!SHAPES[st.shape].tet; values();
  }
  $("sa").oninput = sync; $("sh").oninput = sync;
  $("net").onclick = () => { st.tTarget = st.tTarget ? 0 : 1; $("net").textContent = st.tTarget ? "Złóż ostrosłup" : "Rozłóż siatkę"; if (st.tTarget) { st.spin = false; pitchTarget = 1.15; } else pitchTarget = 0.38; updSpin(); };
  let pitchTarget = null;
  function updSpin() { $("spin").textContent = st.spin ? "Zatrzymaj obrót" : "Obracaj"; $("spin").setAttribute("aria-pressed", st.spin ? "true" : "false"); }
  $("spin").onclick = () => { st.spin = !st.spin; updSpin(); };
  $("reset").onclick = () => { st.yaw = 0.55; pitchTarget = 0.38; st.tTarget = 0; $("net").textContent = "Rozłóż siatkę"; };

  // drag to rotate
  let drag = null;
  $("stage").addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; st.spin = false; updSpin(); pitchTarget = null; $("hint").hidden = true; $("stage").setPointerCapture(e.pointerId); });
  $("stage").addEventListener("pointermove", (e) => { if (!drag) return; st.yaw += (e.clientX - drag.x) * 0.01; st.pitch = Math.max(-0.3, Math.min(1.5, st.pitch + (e.clientY - drag.y) * 0.008)); drag = { x: e.clientX, y: e.clientY }; });
  const end = () => { drag = null; }; $("stage").addEventListener("pointerup", end); $("stage").addEventListener("pointercancel", end);

  function resize() { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); ctx.setTransform(d, 0, 0, d, 0, 0); W = r.width; Hh = r.height; }
  new ResizeObserver(resize).observe(cv); resize();

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (st.spin && !reduce) st.yaw += dt * 0.35;
    if (st.t !== st.tTarget) { const step = reduce ? 1 : dt / 1.3; st.t = st.tTarget > st.t ? Math.min(st.tTarget, st.t + step) : Math.max(st.tTarget, st.t - step); }
    if (pitchTarget !== null) { st.pitch += (pitchTarget - st.pitch) * Math.min(1, dt * 4); if (Math.abs(pitchTarget - st.pitch) < 0.002) { st.pitch = pitchTarget; pitchTarget = null; } }
    draw(); requestAnimationFrame(frame);
  }
  renderShapes(); renderToggles(); sync(); updSpin();
  (document.fonts ? document.fonts.load('italic 20px "CMU Serif"') : Promise.resolve()).catch(() => {}).then(() => requestAnimationFrame(frame));
})();
