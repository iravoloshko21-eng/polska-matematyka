<!doctype html><html lang="pl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"></head><body>
<a href="../" style="position:fixed;z-index:9999;left:max(10px,env(safe-area-inset-left,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));background:#151515;color:#fbf6ea;font:700 13px/1 Inter,system-ui,sans-serif;text-decoration:none;border-radius:999px;padding:10px 14px;box-shadow:3px 3px 0 #5157d6">← Trenażery</a>
<title>Znajdź błąd w dowodzie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one graded "sheet" at a time, red-pen corrections appear after the pupil answers */
:root{
  --bg:#F3F5FA; --paper:#FFFFFF; --ink:#16213A; --muted:#55668A; --line:#DCE5F3; --frame:#C9D4EA;
  --blue:#1F3A93; --blue-soft:#EEF2FA; --pen:#C62828; --pen-soft:#FDECEC; --ok:#2F7A44; --ok-soft:#E9F6EC;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif; --hand:'Kalam','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1524; --paper:#18213A; --ink:#E6EBF5; --muted:#9AA8C6; --line:#25304D; --frame:#34416A;
  --blue:#8FA8F0; --blue-soft:#1E2A4C; --pen:#FF7A70; --pen-soft:#3A1E24; --ok:#6CCB8A; --ok-soft:#183324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1524; --paper:#18213A; --ink:#E6EBF5; --muted:#9AA8C6; --line:#25304D; --frame:#34416A;
  --blue:#8FA8F0; --blue-soft:#1E2A4C; --pen:#FF7A70; --pen-soft:#3A1E24; --ok:#6CCB8A; --ok-soft:#183324; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
h1 span{color:var(--pen)}
.progress{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--frame);background:transparent}
.dot.cur{border-color:var(--blue)}
.dot.good{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--pen);border-color:var(--pen)}
.intro{color:var(--muted);margin:0;max-width:62ch}
.sheet{background:var(--paper);border:1.5px solid var(--frame);border-radius:14px;overflow:hidden}
.task{padding:16px 20px;border-bottom:1.5px solid var(--frame);display:flex;flex-direction:column;gap:6px}
.task .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.task p{margin:0;font-style:italic}
.work{position:relative;padding:14px 20px 18px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.work .lbl{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;background:var(--paper);display:inline-block;padding:0 6px;margin-left:-6px}
.lines{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.lines li{font-family:var(--hand);font-size:20px;line-height:1.55;color:var(--blue);padding:0 6px;border-radius:4px;overflow-wrap:anywhere}
.lines li.err{color:var(--ink);background:var(--pen-soft);text-decoration:underline wavy var(--pen) 1.5px;text-underline-offset:5px}
.margin-note{font-family:var(--hand);color:var(--pen);font-size:19px;margin-top:10px;transform:rotate(-1.2deg);transform-origin:left}
.q{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--paper);border:1.5px solid var(--frame);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft)}
.opt.wrong .k{background:var(--pen);color:var(--paper)}
.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1.5px solid}
.feedback.good{background:var(--ok-soft);border-color:var(--ok)}
.feedback.bad{background:var(--pen-soft);border-color:var(--pen)}
.feedback strong{font-family:var(--display)}
.feedback p{margin:0}
.jury{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.jury b{font-family:var(--display);font-size:18px;color:var(--pen);border:2px solid var(--pen);border-radius:50%;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center}
.row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 20px;min-height:48px;cursor:pointer;background:var(--blue);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:28px 20px}
.big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1}
.big small{font-size:28px;color:var(--muted)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.review li{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--bg)}
.review .m{flex:none;font-weight:800}
.review .m.g{color:var(--ok)} .review .m.b{color:var(--pen)}
@media (prefers-reduced-motion:no-preference){.feedback,.margin-note{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">OMJ · trening zapisu rozwiązań</div>
      <h1>Znajdź <span>błąd</span> w dowodzie</h1>
    </div>
    <div class="progress" id="progress" aria-label="Postęp"></div>
  </header>
  <p class="intro" id="intro">Jesteś w jury. Przeczytaj rozwiązanie ucznia i wskaż, co jest z nim nie tak. Uwaga: jedno z rozwiązań może być całkiem poprawne.</p>
  <main id="app" style="display:flex;flex-direction:column;gap:16px"></main>
</div>

<script>
const ERR={
  ex:"Sprawdzono tylko przykłady zamiast dowodu",
  case:"Pominięto jeden z przypadków",
  neg:"Błędnie zaprzeczono tezę",
  conv:"Udowodniono twierdzenie odwrotne, a nie to z zadania",
  just:"Brak uzasadnienia ważnego kroku",
  other:"Nie wykazano, że innych rozwiązań nie ma",
  dir:"Rozumowanie zaczyna się od tezy",
  div:"Dzielenie przez wyrażenie, które może być zerem",
  ok:"Rozwiązanie jest poprawne"
};
const Q=[
 {task:"Udowodnij, że suma dwóch liczb nieparzystych jest parzysta.",
  lines:["1 + 3 = 4","5 + 7 = 12","11 + 13 = 24","Zawsze wychodzi liczba parzysta, więc teza jest prawdziwa."],
  err:[0,1,2],ans:"ex",opts:["ex","case","just","ok"],pts:0,
  note:"Trzy przykłady to nie dowód!",
  why:"Przykłady nie wykluczają, że dla innych liczb jest inaczej. Trzeba wziąć dowolne liczby: 2a + 1 i 2b + 1. Ich suma to 2(a + b + 1), czyli liczba parzysta."},
 {task:"Udowodnij, że jeśli n² jest podzielne przez 3, to n jest podzielne przez 3.",
  lines:["Załóżmy, że n jest podzielne przez 3, czyli n = 3k.","Wtedy n² = 9k² = 3 · 3k², więc n² jest podzielne przez 3.","Teza jest prawdziwa."],
  err:[0],ans:"conv",opts:["conv","neg","ex","ok"],pts:0,
  note:"To jest odwrotnie!",
  why:"Uczeń założył to, co trzeba udowodnić (3 | n), i wyprowadził założenie (3 | n²). Poprawnie: nie wprost — jeśli n daje resztę 1 lub 2, to n² daje resztę 1, więc n² nie dzieli się przez 3."},
 {task:"Udowodnij, że dla każdej liczby całkowitej n liczba n² + n jest parzysta.",
  lines:["Niech n = 2k.","Wtedy n² + n = 4k² + 2k = 2(2k² + k).","Jest to liczba parzysta, co kończy dowód."],
  err:[0],ans:"case",opts:["case","ex","dir","ok"],pts:2,
  note:"A co, gdy n jest nieparzyste?",
  why:"Rozważono tylko n parzyste. Brakuje przypadku n = 2k + 1: n² + n = (2k + 1)(2k + 2) = 2(2k + 1)(k + 1). Albo krócej: n² + n = n(n + 1), a z dwóch kolejnych liczb jedna jest parzysta."},
 {task:"Pięć liczb całkowitych ma sumę 21. Udowodnij, że co najmniej jedna z nich jest większa od 4.",
  lines:["Załóżmy nie wprost, że wszystkie liczby są mniejsze od 4.","Wtedy każda jest co najwyżej 3, więc suma ≤ 5 · 3 = 15.","15 < 21 — sprzeczność. Teza jest prawdziwa."],
  err:[0],ans:"neg",opts:["neg","conv","just","ok"],pts:2,
  note:"Zaprzeczenie „większa od 4” to „≤ 4”, nie „< 4”.",
  why:"Przypadek, w którym jakaś liczba równa się 4, został pominięty. Poprawnie: załóżmy, że każda liczba jest ≤ 4. Wtedy suma ≤ 20 < 21 — sprzeczność."},
 {task:"Wyznacz wszystkie liczby pierwsze p, dla których p, p + 2 i p + 4 są pierwsze.",
  lines:["Dla p = 3 mamy liczby 3, 5, 7 — wszystkie są pierwsze.","Odpowiedź: p = 3."],
  err:[1],ans:"other",opts:["other","ex","case","ok"],pts:0,
  note:"Skąd wiadomo, że to jedyna?",
  why:"Znalezienie jednego rozwiązania to dopiero połowa. Trzeba wykazać, że innych nie ma: jedna z liczb p, p + 2, p + 4 zawsze dzieli się przez 3 (dają różne reszty z dzielenia przez 3), więc któraś z nich musi być równa 3."},
 {task:"Udowodnij, że dla każdej liczby całkowitej n liczba n³ − n jest podzielna przez 6.",
  lines:["n³ − n = n(n² − 1) = (n − 1) · n · (n + 1).","To iloczyn trzech kolejnych liczb całkowitych, więc dzieli się przez 6."],
  err:[1],ans:"just",opts:["just","case","ex","ok"],pts:5,
  note:"Dlaczego przez 6? Napisz to!",
  why:"Pomysł jest dobry, ale brakuje zdania wyjaśnienia: wśród trzech kolejnych liczb jest liczba parzysta i liczba podzielna przez 3, a 2 i 3 są względnie pierwsze, więc iloczyn dzieli się przez 6. Jury może za to odjąć punkt."},
 {task:"Rozwiąż równanie x² = 3x.",
  lines:["Dzielimy obie strony przez x:","x = 3.","Odpowiedź: x = 3."],
  err:[0],ans:"div",opts:["div","other","case","ok"],pts:2,
  note:"A jeśli x = 0?",
  why:"Dzielenie przez x jest dozwolone tylko dla x ≠ 0, a właśnie x = 0 też jest rozwiązaniem. Poprawnie: x² − 3x = 0, czyli x(x − 3) = 0, więc x = 0 lub x = 3."},
 {task:"Udowodnij, że dla dowolnych liczb rzeczywistych a, b zachodzi a² + b² ≥ 2ab.",
  lines:["a² + b² ≥ 2ab","a² − 2ab + b² ≥ 0","(a − b)² ≥ 0","To jest prawda, więc teza jest prawdziwa."],
  err:[0,3],ans:"dir",opts:["dir","conv","just","ok"],pts:5,
  note:"Zaczynasz od tego, co masz udowodnić.",
  why:"Z tezy wyprowadzono prawdę — to samo w sobie niczego nie dowodzi. Tu przejścia są równoważne, więc wystarczy to zaznaczyć (⇔) albo zapisać w drugą stronę: (a − b)² ≥ 0, więc a² − 2ab + b² ≥ 0, czyli a² + b² ≥ 2ab."},
 {task:"Udowodnij, że kwadrat liczby nieparzystej daje resztę 1 z dzielenia przez 8.",
  lines:["Niech n = 2k + 1, gdzie k jest liczbą całkowitą.","n² = 4k² + 4k + 1 = 4k(k + 1) + 1.","Spośród liczb k i k + 1 jedna jest parzysta, więc k(k + 1) jest parzyste.","Zatem 4k(k + 1) dzieli się przez 8, a n² daje resztę 1 z dzielenia przez 8."],
  err:[],ans:"ok",opts:["ok","just","case","ex"],pts:6,
  note:"Bez zastrzeżeń. 6 punktów.",
  why:"Każdy krok jest uzasadniony, łącznie z najtrudniejszym: dlaczego k(k + 1) jest parzyste. Tak powinien wyglądać pełny zapis."}
];
let i=0, picks=[];
const app=document.getElementById("app"), prog=document.getElementById("progress"), intro=document.getElementById("intro");
function dots(){prog.innerHTML=Q.map((q,j)=>{let c="dot";if(picks[j]!==undefined)c+=picks[j]===q.ans?" good":" bad";else if(j===i)c+=" cur";return `<span class="${c}" title="Zadanie ${j+1}"></span>`}).join("")}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
  dots();
  if(i>=Q.length) return finish();
  intro.hidden=i>0;
  const q=Q[i], answered=picks[i]!==undefined;
  const lines=q.lines.map((l,j)=>`<li class="${answered&&q.err.includes(j)?"err":""}">${esc(l)}</li>`).join("");
  const opts=q.opts.map((k,j)=>{let c="opt";if(answered){if(k===q.ans)c+=" right";else if(k===picks[i])c+=" wrong";}
    return `<button class="${c}" data-k="${k}" ${answered?"disabled":""}><span class="k">${"ABCD"[j]}</span><span>${ERR[k]}</span></button>`}).join("");
  const good=picks[i]===q.ans;
  app.innerHTML=`
  <section class="sheet" aria-label="Zadanie ${i+1} z ${Q.length}">
    <div class="task"><span class="lbl">Zadanie ${i+1} / ${Q.length}</span><p>${esc(q.task)}</p></div>
    <div class="work"><span class="lbl">Rozwiązanie ucznia</span><ol class="lines">${lines}</ol>
      ${answered?`<div class="margin-note">${esc(q.note)}</div>`:""}</div>
  </section>
  <p class="q">Co jest nie tak z tym rozwiązaniem?</p>
  <div class="opts">${opts}</div>
  ${answered?`<div class="feedback ${good?"good":"bad"}" role="status">
     <strong>${good?"Dobrze!":"Nie tym razem."} ${good?"":"Poprawna odpowiedź: "+ERR[q.ans]+"."}</strong>
     <p>${esc(q.why)}</p>
     <span class="jury"><b>${q.pts}</b> tyle punktów (na 6) dałoby jury</span></div>
   <div class="row"><button class="btn" id="next">${i===Q.length-1?"Zobacz wynik":"Następne zadanie"}</button></div>`:""}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picks[i]=b.dataset.k;render();const n=document.getElementById("next");n&&n.focus()});
  const n=document.getElementById("next"); if(n) n.onclick=()=>{i++;render();window.scrollTo({top:0})};
}
function finish(){
  intro.hidden=true;
  const score=Q.filter((q,j)=>picks[j]===q.ans).length;
  const msg=score===Q.length?"Komplet! Jury może Cię zatrudnić.":score>=6?"Bardzo dobrze. Przejrzyj zadania z czerwonym znakiem.":"Wróć do zadań z czerwonym znakiem i przeczytaj wyjaśnienia.";
  app.innerHTML=`<section class="sheet result">
    <div class="eyebrow">Wynik</div>
    <div class="big">${score}<small> / ${Q.length}</small></div>
    <p style="margin:0">${msg}</p>
    <ul class="review">${Q.map((q,j)=>{const g=picks[j]===q.ans;return `<li><span class="m ${g?"g":"b"}">${g?"✓":"✗"}</span><span><b>Zadanie ${j+1}.</b> ${ERR[q.ans]}</span></li>`}).join("")}</ul>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="again">Rozwiąż jeszcze raz</button></div>
  </section>`;
  document.getElementById("again").onclick=()=>{i=0;picks=[];render();window.scrollTo({top:0})};
}
render();
</script>

</body></html>
